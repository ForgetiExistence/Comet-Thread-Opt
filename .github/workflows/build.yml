name: Build Comet Module

on:
  push:
    branches:
      - main
      - fuxi-8g2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate module
        run: |
          set -e
          test -f module/module.prop
          test -f module/service.sh
          test -f module/applist.conf
          test -f module/gamelist.conf

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version=' module/module.prop | cut -d= -f2-)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build ZIP
        run: |
          set -e
          mkdir -p dist
          cd module
          zip -r "../dist/Comet-Thread-Opt-${{ steps.version.outputs.version }}.zip" .

      - name: Generate SHA256
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Comet-Thread-Opt-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
