name: Build Comet Module (Fuxi-8G2)

on:
  push:
    branches: [fuxi-8g2]
    paths:
      - 'module/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      core_channel:
        description: 'AkiAppOpt core channel'
        required: false
        default: 'stable'
        type: choice
        options:
          - stable
          - dev
      core_repo:
        description: 'Core repository (dev channel only, e.g. your fork)'
        required: false
        default: 'AkiHaza/AkiAppOpt'
      core_ref:
        description: 'Core ref (dev channel only; branch/tag, e.g. Dev or fuxi-8g2)'
        required: false
        default: 'Dev'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CORE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.core_channel || 'stable' }}
      CORE_REPO: ${{ github.event_name == 'workflow_dispatch' && inputs.core_repo || 'AkiHaza/AkiAppOpt' }}
      CORE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.core_ref || 'Dev' }}

    steps:
      - name: Checkout Comet rules & module shell
        uses: actions/checkout@v4

      - name: Resolve core channel
        id: chan
        run: |
          if [ "$CORE_CHANNEL" = "dev" ]; then
            echo "ref=${CORE_REF:-Dev}" >> "$GITHUB_OUTPUT"
            echo "suffix=-dev" >> "$GITHUB_OUTPUT"
            echo "repo=$CORE_REPO" >> "$GITHUB_OUTPUT"
          else
            echo "ref=1.1.0"   >> "$GITHUB_OUTPUT"
            echo "suffix="     >> "$GITHUB_OUTPUT"
            echo "repo=AkiHaza/AkiAppOpt" >> "$GITHUB_OUTPUT"
          fi
          echo "channel=$CORE_CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Checkout AkiAppOpt core
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.chan.outputs.repo }}
          ref: ${{ steps.chan.outputs.ref }}
          path: akiappopt

      - name: Resolve core commit
        id: core
        run: |
          echo "sha=$(git -C akiappopt rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          git -C akiappopt log -1 --oneline

      - name: Setup Android NDK (official r27d)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o ndk.zip "https://dl.google.com/android/repository/android-ndk-r27d-linux.zip"
          unzip -q ndk.zip -d "$RUNNER_TEMP/ndk"
          rm -f ndk.zip
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/ndk/android-ndk-r27d" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/ndk/android-ndk-r27d/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version | head -1

      - name: Validate module shell
        run: |
          set -e
          for f in module/customize.sh module/action.sh module/service.sh \
                   module/META-INF/com/google/android/update-binary; do
            test -f "$f"
            sh -n "$f"
          done
          test -f app/App_Fuxi_8G2.txt
          test -f app/App_common.txt
          test -f game/Game_common.txt
          echo "shell scripts OK"

      - name: Build AkiAppOpt binaries
        shell: bash
        run: |
          set -euo pipefail
          aki="$GITHUB_WORKSPACE/akiappopt/module"
          module_dir="$GITHUB_WORKSPACE/module"
          toolchain="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          sources="$aki/AppOpt.c"
          if [ -f "$aki/load_balancer.c" ]; then
            echo "core channel provides load_balancer -> linking it"
            sources="$sources $aki/load_balancer.c"
          fi
          build() {
            mkdir -p "$module_dir/bin/$1"
            $toolchain/$2 -O2 -ffunction-sections -fdata-sections -s \
              -Wl,--gc-sections -o "$module_dir/bin/$1/AppOpt" $sources
            chmod 0755 "$module_dir/bin/$1/AppOpt"
          }
          build arm64-v8a   aarch64-linux-android21-clang
          build armeabi-v7a armv7a-linux-androideabi21-clang
          build x86_64      x86_64-linux-android21-clang
          file "$module_dir"/bin/*/AppOpt

      - name: Package module
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version=//p' module/module.prop | head -n1)"
          suffix="${{ steps.chan.outputs.suffix }}"
          core_sha="${{ steps.core.outputs.sha }}"
          if [ -n "$suffix" ]; then
            artifact="Comet-Thread-Opt-${version}${suffix}-${core_sha}.zip"
          else
            artifact="Comet-Thread-Opt-${version}.zip"
          fi
          (cd module && zip -r -9 "../${artifact}" . -x 'bin/*/.gitkeep')
          sha256sum "${artifact}" | tee "${artifact}.sha256"
          echo "artifact=${artifact}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: |
            ${{ steps.package.outputs.artifact }}
            ${{ steps.package.outputs.artifact }}.sha256
          if-no-files-found: error
          retention-days: 30
