name: Build Comet Module

on:
  push:
    branches:
      - main
      - fuxi-8g2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository
        run: |
          set -e
          test -d app
          test -d game
          test -f README.md
          test -f app/App_Fuxi_8G2.txt
          test -f app/App_common.txt
          test -f game/Game_common.txt

      - name: Get version
        id: version
        run: |
          VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo fuxi-8g2)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build configuration package
        run: |
          set -e
          mkdir -p dist/package
          cp -a app game README.md ChangeLog.txt dist/package/ 2>/dev/null || true
          cd dist/package
          zip -r "../Comet-Thread-Opt-${{ steps.version.outputs.version }}.zip" .

      - name: Generate SHA256
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Comet-Thread-Opt-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
